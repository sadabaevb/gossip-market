[package]
name = "gossipmarket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gossip Market: agents that find each other over libp2p and settle N-party trades through the NEAR Intents verifier"

[dependencies]
intents.workspace = true
chain.workspace = true
market.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
libp2p = { version = "0.57", features = ["tokio", "tcp", "noise", "yamux", "macros", "mdns", "kad", "gossipsub", "request-response", "json", "identify", "ed25519"] }
ratatui = "0.30"
toml = "0.9"
