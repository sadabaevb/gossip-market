[package]
name = "market"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gossip Market: signed wants, the order book every node rebuilds from gossip, and the ring finder"

[dependencies]
intents.workspace = true
bs58.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# 256-bit intermediates: yoctoNEAR amounts multiplied together do not fit in 128 bits.
primitive-types = { version = "0.13", default-features = false }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
